name: Release

# Publishing to PyPI is irreversible - a version number can never be reused, even
# after a deletion. So the tests run first, and the tag has to agree with the version
# in the source before anything is uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check canvasgrade tests
      - run: pytest --cov=canvasgrade --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Refuse to publish if the tag disagrees with the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('canvasgrade/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "source version: $version"
          echo "tag:            $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Check the wheel installs and runs on its own
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install "$(ls dist/*.whl)"
          /tmp/check/bin/canvasgrade --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is no
    # API token to store, leak or rotate.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release, or moving a tag, should not fail on a version that
          # is already up. PyPI never lets a version be replaced, so this only ever
          # skips an identical upload.
          skip-existing: true
